
<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A deep dive into my executive biography.">
<title>Executive Biography</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1020;
  --alt:#111b2e;
  --surface:#16233b;
  --text:#edf2fa;
  --muted:#adbed4;
  --accent:#91b6ff;
  --line:#2a3a55;
  --header:rgba(11,16,32,.96)
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f8fafd;
  --alt:#edf2f8;
  --surface:#e6edf6;
  --text:#17253e;
  --muted:#536782;
  --accent:#285caa;
  --line:#d1dce9;
  --header:rgba(248,250,253,.96)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:145px}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Tahoma,sans-serif;
  font-size:16px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased
}
html[lang="fa"] body{
  font-family:Tahoma,"Geeza Pro",Arial,sans-serif;
  line-height:2.1
}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button,input,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.container{width:min(1140px,calc(100% - 44px));margin-inline:auto}
.skip{
  position:absolute;
  top:-100px;
  left:12px;
  z-index:100;
  background:var(--accent);
  color:var(--bg);
  padding:10px
}
.skip:focus{top:10px}
.site-header{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--header);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)
}
.header-inner{
  width:min(1360px,calc(100% - 32px));
  margin:auto;
  min-height:83px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.brand{
  font-size:10px;
  font-weight:750;
  letter-spacing:.08em;
  white-space:nowrap;
  flex-shrink:0
}
.brand-symbol{
  color:var(--accent);
  font-size:20px;
  margin-inline-end:7px
}
.nav-links{
  display:flex;
  flex-wrap:nowrap;
  white-space:nowrap;
  align-items:center;
  gap:clamp(9px,1.1vw,19px);
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
  padding:8px 0;
  flex:1
}
.nav-links a{
  font-size:clamp(10px,.78vw,12px);
  font-weight:600;
  color:var(--muted);
  flex-shrink:0;
  white-space:nowrap
}
.nav-links a:hover{color:var(--accent)}
.header-controls{
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0
}
.lang-switch{display:flex;align-items:center;gap:5px}
.lang-switch button{
  color:var(--muted);
  border:0;
  background:transparent;
  font-size:11px;
  padding:5px
}
.lang-switch button.active{
  color:var(--accent);
  font-weight:800
}
.theme-toggle{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:50%;
  width:36px;
  height:36px
}
.hero{
  min-height:85svh;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border-bottom:1px solid var(--line);
  background:radial-gradient(
    ellipse at 80% 25%,
    rgba(76,117,193,.18),
    transparent 46%
  ),var(--bg)
}
.hero::before,.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(145,182,255,.10);
  pointer-events:none;
  z-index:-1
}
.hero::before{
  width:700px;
  height:700px;
  inset-inline-end:-260px;
  top:-100px
}
.hero::after{
  width:450px;
  height:450px;
  inset-inline-end:-135px;
  top:25px
}
.hero-content{
  padding-block:105px 115px;
  min-width:0
}
.eyebrow,.section-number{
  color:var(--accent);
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em
}
.hero h1{
  max-width:100%;
  font-size:clamp(42px,7vw,87px);
  line-height:1.14;
  font-weight:500;
  letter-spacing:-.05em;
  margin:25px 0 32px
}
.hero-intro{
  max-width:690px;
  font-size:clamp(17px,2vw,20px);
  color:var(--muted)
}
.hero-line{
  width:85px;
  height:1px;
  background:var(--accent);
  margin:43px 0 28px
}
.hero-motto{
  font-size:clamp(24px,3vw,35px);
  line-height:1.4;
  margin:0
}
.hero-philosophy{
  max-width:790px;
  color:var(--muted);
  font-size:clamp(16px,1.8vw,19px);
  margin-top:21px;
  line-height:1.75
}
.hero-cta{
  display:inline-block;
  margin-top:37px;
  color:var(--accent);
  font-size:13px;
  font-weight:700
}
.section{
  padding-block:105px;
  border-bottom:1px solid var(--line)
}
.section.alt{background:var(--alt)}
.section-layout{
  display:grid;
  grid-template-columns:200px minmax(0,1fr);
  gap:65px
}
.section-content{max-width:795px;min-width:0}
.section-content h2{
  font-size:clamp(31px,4vw,51px);
  font-weight:500;
  line-height:1.3;
  letter-spacing:-.035em;
  margin:0 0 35px
}
.section-content h3{
  font-size:27px;
  font-weight:500;
  line-height:1.4;
  margin:55px 0 25px
}
.paragraphs p,.section-content>p{
  font-size:17px;
  color:var(--muted);
  margin:0 0 23px;
  line-height:1.98
}
.paragraphs p:first-child{color:var(--text)}
.timeline{
  margin-top:43px;
  border-top:1px solid var(--line)
}
.timeline-item{
  display:grid;
  grid-template-columns:135px minmax(0,1fr);
  gap:24px;
  padding:25px 0;
  border-bottom:1px solid var(--line)
}
.timeline-year{
  direction:ltr;
  text-align:start;
  color:var(--accent);
  font-size:14px;
  font-weight:700
}
.timeline-item h4{
  font-size:18px;
  font-weight:600;
  margin:0 0 5px
}
.timeline-item p{
  font-size:14px;
  color:var(--muted);
  margin:0
}
.skills{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px
}
.skill{
  padding:22px;
  background:var(--surface);
  border:1px solid var(--line);
  font-size:14px
}
.skill::before{
  content:"◆";
  font-size:8px;
  color:var(--accent);
  margin-inline-end:13px
}
.pub-toolbar{
  display:flex;
  gap:12px;
  margin:30px 0
}
.pub-toolbar input,.pub-toolbar select{
  min-height:46px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:3px;
  color:var(--text);
  padding:10px 13px
}
.pub-toolbar input{flex:1;min-width:0}
.pub-count{
  font-size:13px;
  color:var(--muted)
}
.pub-item{
  display:grid;
  grid-template-columns:90px minmax(0,1fr);
  gap:18px;
  padding:24px 0;
  border-top:1px solid var(--line)
}
.pub-year{
  direction:ltr;
  text-align:start;
  color:var(--accent);
  font-size:14px;
  font-weight:700
}
.pub-item h4{
  margin:4px 0 8px;
  font-size:17px;
  font-weight:500;
  line-height:1.55
}
.pub-item p{
  margin:3px 0;
  color:var(--muted);
  font-size:13px
}
.link-button{
  display:inline-flex;
  gap:12px;
  align-items:center;
  margin:20px 10px 0 0;
  border:1px solid var(--line);
  padding:12px 20px;
  font-size:13px;
  background:transparent;
  color:var(--text)
}
.link-button:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.project-name{
  font-size:28px!important;
  color:var(--accent)!important;
  font-weight:600
}
.quote{
  border-inline-start:2px solid var(--accent);
  padding-inline-start:25px;
  font-size:25px;
  line-height:1.65;
  margin:35px 0
}
.empty{
  color:var(--muted);
  font-size:15px;
  padding:20px 0
}
footer{
  padding:30px 0;
  background:var(--alt);
  color:var(--muted);
  font-size:12px
}
.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px
}
.lab-intro{max-width:720px}
.lab-tabs{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:35px 0 23px
}
.lab-tab{
  padding:11px 15px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:3px;
  font-size:13px;
  text-align:start;
  white-space:nowrap
}
.lab-tab:hover,.lab-tab.active{
  color:var(--accent);
  border-color:var(--accent);
  background:var(--surface)
}
.lab-panel{
  border:1px solid var(--line);
  background:var(--surface);
  padding:clamp(22px,4vw,42px)
}
.lab-case-label{
  color:var(--accent);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em
}
.lab-case-title{
  font-size:clamp(22px,3vw,32px)!important;
  margin:12px 0 19px!important;
  font-weight:500!important
}
.lab-scenario{
  color:var(--text);
  font-size:17px;
  line-height:1.95;
  margin:0 0 26px
}
.lab-question{
  color:var(--accent);
  font-weight:650;
  font-size:15px;
  margin:0 0 15px
}
.lab-choices{display:grid;gap:10px}
.lab-choice{
  display:flex;
  align-items:flex-start;
  gap:14px;
  text-align:start;
  width:100%;
  padding:18px 20px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  border-radius:3px;
  transition:border-color .2s,background .2s
}
.lab-choice:hover,.lab-choice[aria-pressed="true"]{
  border-color:var(--accent)
}
.lab-choice[aria-pressed="true"]{background:var(--alt)}
.lab-choice-letter{
  min-width:25px;
  color:var(--accent);
  font-weight:700;
  font-size:13px;
  direction:ltr
}
.lab-result{
  margin-top:24px;
  border-top:1px solid var(--line);
  padding-top:25px
}
.lab-result p{
  color:var(--muted);
  font-size:15px;
  line-height:1.85
}
.lab-result-heading{
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  margin:0 0 10px
}
.lab-reflection{
  border-inline-start:2px solid var(--accent);
  padding-inline-start:19px;
  margin:21px 0;
  color:var(--text)!important
}
.lab-actions{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
  margin-top:25px
}
.lab-action{
  border:1px solid var(--line);
  color:var(--accent);
  background:transparent;
  padding:10px 16px;
  font-size:13px
}
.lab-action:hover{border-color:var(--accent)}
.lab-disclaimer{
  color:var(--muted);
  font-size:12px;
  margin-top:20px;
  line-height:1.8
}
.hero h1,
.hero-motto,
.section-content h2,
.section-content h3,
.timeline-item h4,
.pub-item h4,
.lab-case-title,
.lab-result-heading{
  white-space:nowrap!important;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  display:block;
  scrollbar-width:thin;
  overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch;
  padding-bottom:6px
}
.nav-links,.nav-links a,.nav-links a *,.brand{
  white-space:nowrap!important
}
.heading-nowrap{
  display:inline-block;
  white-space:nowrap!important;
  unicode-bidi:isolate
}
.heading-english{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
  white-space:nowrap!important;
  font-size:.65em;
  font-weight:500;
  color:var(--accent);
  vertical-align:baseline
}
.nav-english{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline;
  white-space:nowrap!important
}
html[dir="rtl"] .hero h1,
html[dir="rtl"] .section-content h2,
html[dir="rtl"] .section-content h3{
  letter-spacing:0;
  line-height:1.6
}
html[dir="rtl"] .eyebrow{letter-spacing:0}
html[dir="rtl"] .paragraphs p{line-height:2.2}
html[dir="rtl"] .brand{letter-spacing:0}
html[dir="rtl"] .nav-links a{font-size:11px}
html[dir="rtl"] .link-button{margin:20px 0 0 10px}
@media(max-width:1150px){
  .header-inner{
    flex-wrap:wrap;
    row-gap:0;
    padding-block:10px
  }
  .nav-links{
    order:3;
    flex-basis:100%;
    min-width:100%;
    padding:5px 0
  }
  .section-layout{
    grid-template-columns:160px minmax(0,1fr);
    gap:40px
  }
}
@media(max-width:680px){
  .container,.header-inner{width:calc(100% - 36px)}
  .header-inner{min-height:70px}
  .brand{font-size:9px}
  .hero{min-height:690px}
  .hero-content{padding-block:80px}
  .hero h1{font-size:clamp(39px,10vw,58px)}
  .section{padding-block:74px}
  .section-layout{display:block}
  .section-number{display:block;margin-bottom:21px}
  .section-content h2{margin-bottom:28px}
  .paragraphs p{font-size:16px}
  .timeline-item{grid-template-columns:1fr;gap:5px}
  .skills{grid-template-columns:1fr}
  .pub-toolbar{flex-direction:column}
  .pub-item{grid-template-columns:1fr;gap:4px}
  .footer-inner{flex-direction:column}
  .lab-tabs{flex-direction:column}
  .lab-tab{width:100%;overflow-x:auto}
  .lab-choice{padding:15px}
  html[dir="rtl"] .section-content h2{font-size:30px}
  html[dir="rtl"] .section-content h3{font-size:23px}
}
@media(max-width:375px){
  .brand-label{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .lab-choice{transition:none}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#top">
      <span class="brand-symbol">◈</span>
      <span class="brand-label">EXECUTIVE BIOGRAPHY</span>
    </a>
    <nav id="navLinks" class="nav-links" aria-label="Main navigation"></nav>
    <div class="header-controls">
      <div class="lang-switch" aria-label="Language selection">
        <button data-lang="de" type="button">DE</button>
        <button data-lang="en" type="button">EN</button>
        <button data-lang="fa" type="button" lang="fa">فارسی</button>
      </div>
      <button id="themeToggle" class="theme-toggle"
              type="button" aria-label="Change colour theme">◐</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="container hero-content">
      <p class="eyebrow" id="heroKicker"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-intro" id="heroIntro"></p>
      <div class="hero-line"></div>
      <p class="hero-motto" id="heroMotto"></p>
      <p class="hero-philosophy" id="heroPhilosophy"></p>
      <a class="hero-cta" id="heroCTA" href="#profile"></a>
    </div>
  </section>

  <section class="section" id="profile">
    <div class="container section-layout">
      <aside class="section-number">01 / PROFILE</aside>
      <div class="section-content">
        <h2 id="profileHeading"></h2>
        <div id="profileText" class="paragraphs"></div>
      </div>
    </div>
  </section>

  <section class="section alt" id="education">
    <div class="container section-layout">
      <aside class="section-number">02 / EDUCATION</aside>
      <div class="section-content">
        <h2 id="educationHeading"></h2>
        <div id="educationText" class="paragraphs"></div>
        <div id="educationTimeline" class="timeline"></div>
      </div>
    </div>
  </section>

  <section class="section" id="career">
    <div class="container section-layout">
      <aside class="section-number">03 / EXPERIENCE</aside>
      <div class="section-content">
        <h2 id="careerHeading"></h2>
        <div id="careerText" class="paragraphs"></div>
        <h3 id="transformationHeading"></h3>
        <div id="transformationText" class="paragraphs"></div>
        <div id="careerTimeline" class="timeline"></div>
      </div>
    </div>
  </section>

  <section class="section alt" id="expertise">
    <div class="container section-layout">
      <aside class="section-number">04 / EXPERTISE</aside>
      <div class="section-content">
        <h2 id="expertiseHeading"></h2>
        <div id="expertiseSkills" class="skills"></div>
      </div>
    </div>
  </section>

  <section class="section" id="publications">
    <div class="container section-layout">
      <aside class="section-number">05 / PUBLICATIONS</aside>
      <div class="section-content">
        <h2 id="publicationsHeading"></h2>
        <p id="publicationsIntro"></p>
        <div class="pub-toolbar">
          <input id="pubSearch" type="search"
                 aria-label="Search publications">
          <select id="pubFilter" aria-label="Filter publications"></select>
        </div>
        <p id="pubCount" class="pub-count"></p>
        <div id="pubList"></div>
      </div>
    </div>
  </section>

  <section class="section alt" id="entrepreneurship">
    <div class="container section-layout">
      <aside class="section-number">06 / ENTREPRENEURSHIP</aside>
      <div class="section-content">
        <h2 id="entrepreneurshipHeading"></h2>
        <p class="project-name">Ready Labs</p>
        <div id="entrepreneurshipText" class="paragraphs"></div>
        <a class="link-button" href="https://www.ready-tender.de/"
           target="_blank" rel="noopener noreferrer">Ready Tender ↗</a>
        <a class="link-button" href="https://www.ready-labs.ai/"
           target="_blank" rel="noopener noreferrer">Ready Labs ↗</a>
        <h3 id="motivationHeading"></h3>
        <div id="motivationText" class="paragraphs"></div>
      </div>
    </div>
  </section>

  <section class="section" id="lab">
    <div class="container section-layout">
      <aside class="section-number">07 / THINKING LAB</aside>
      <div class="section-content">
        <h2 id="labHeading"></h2>
        <div id="labIntro" class="lab-intro paragraphs"></div>
        <div id="labTabs" class="lab-tabs" role="group"
             aria-label="Thinking Lab cases"></div>
        <div id="labPanel" class="lab-panel"></div>
        <p id="labDisclaimer" class="lab-disclaimer"></p>
      </div>
    </div>
  </section>

  <section class="section alt" id="contact">
    <div class="container section-layout">
      <aside class="section-number">08 / CONTACT</aside>
      <div class="section-content">
        <h2 id="contactHeading"></h2>
        <p id="contactIntro"></p>
        <a class="link-button" href="https://www.ready-labs.ai/"
           target="_blank" rel="noopener noreferrer">Ready Labs ↗</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-inner">
    <span id="footerCopyright"></span>
    <a href="https://www.ready-labs.ai/"
       target="_blank" rel="noopener noreferrer">Ready Labs ↗</a>
  </div>
</footer>

<script>
"use strict";

const publications=[
  [2009,"Khakzad","Das Instrument der Financial Covenants und seine Bedeutung für das inländische Kreditgeschäft in der internationalen Finanzkrise","Josef Eul Verlag, Lohmar","ISBN 978-3-89936-848-2","book"],
  [2008,"Khakzad","Die Rechtsprechung des Europäischen Gerichtshofs im Hinblick auf die ertragsteuerliche Organschaft in Deutschland","Tectum Verlag, Marburg","ISBN 978-3-8288-9659-8","book"],
  [2010,"Bedau / Khakzad / Krakuhn","Anwendungsbereich und Grenzen der Critical Terms Match-Methode","IRZ","Heft 11/2010","article"],
  [2011,"Bauer / Kalinowski / Khakzad","Bewertungseinheiten nach BilMoG – Sonderfragen im Rahmen der Umsetzung der gesetzlichen Regelungen","Deloitte","White Paper Nr. 45","paper"],
  [2012,"Khakzad / Degelmann","Bewertungseinheiten nach BilMoG","Deloitte","White Paper Nr. 48","paper"],
  [2012,"Bauer / Khakzad / Schildmann","Bilanzierung und Bewertung von anteilsbasierten Vergütungen – Eine Einführung nach HGB","Deloitte","White Paper Nr. 50","paper"],
  [2012,"Khakzad / Bauer","Anteilsbasierte Mitarbeitervergütungen – eine praxisrelevante Betrachtung im Kontext nationaler und internationaler Rechnungslegungsvorschriften","IRZ","Heft 7/8/2012","article"],

function setText(id,value){
  document.getElementById(id).textContent=value;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function paragraphsHTML(lines){
  return lines.map(line=>`<p>${escapeHTML(line)}</p>`).join("");
}

function timelineHTML(items){
  return items.map(([year,heading,detail])=>`
    <article class="timeline-item">
      <div class="timeline-year" dir="ltr">${escapeHTML(year)}</div>
      <div>
        <h4>${escapeHTML(heading)}</h4>
        <p>${escapeHTML(detail)}</p>
      </div>
    </article>
  `).join("");
}

function bilingualHeadingHTML(label){
  const match=label.match(/^(.*?)\s+\(([^()]*)\)$/);
  if(!match)return escapeHTML(label);
  return `<span class="heading-nowrap">`+
    `<span lang="fa" dir="rtl">${escapeHTML(match[1])}</span> `+
    `<bdi class="heading-english" lang="en" dir="ltr">`+
    `(${escapeHTML(match[2])})</bdi></span>`;
}

function bilingualNavHTML(label){
  const match=label.match(/^(.*?)\s+\(([^()]*)\)$/);
  if(!match)return escapeHTML(label);
  return `<span lang="fa">${escapeHTML(match[1])}</span> `+
    `<bdi class="nav-english" lang="en" dir="ltr">`+
    `(${escapeHTML(match[2])})</bdi>`;
}

function setHeading(id,value,lang){
  const element=document.getElementById(id);
  if(lang==="fa"){
    element.innerHTML=bilingualHeadingHTML(value);
  }else{
    element.textContent=value;
  }
}

function renderPublications(){
  const t=translations[currentLang];
  const query=document.getElementById("pubSearch")
    .value.trim().toLocaleLowerCase();
  const category=document.getElementById("pubFilter").value;
  const results=publications.filter(pub=>{
    const searchable=[pub[1],pub[2],pub[3],pub[4]]
      .join(" ").toLocaleLowerCase();
    return searchable.includes(query)&&
      (category==="all"||pub[5]===category);
  }).sort((a,b)=>b[0]-a[0]);

  setText("pubCount",results.length+" "+t.count);
  const list=document.getElementById("pubList");

  if(!results.length){
    list.innerHTML=`<p class="empty">${escapeHTML(t.noResults)}</p>`;
    return;
  }

  list.innerHTML=results.map(pub=>`
    <article class="pub-item">
      <div class="pub-year" dir="ltr">${escapeHTML(pub[0])}</div>
      <div>
        <p>${escapeHTML(pub[3])}</p>
        <h4>${escapeHTML(pub[2])}</h4>
        <p>${escapeHTML(pub[1])}</p>
        <p>${escapeHTML(pub[4])}</p>
      </div>
    </article>
  `).join("");
}

      activeCase=Number(button.dataset.case);
      renderLab();
    });
  });

  const result=selected===null?"":`
    <div class="lab-result" id="labResult">
      <p class="lab-result-heading">
        ${currentLang==="fa"
          ?bilingualHeadingHTML(t.labConsequence)
          :escapeHTML(t.labConsequence)}
      </p>
      <p>${escapeHTML(item.choices[selected].consequence)}</p>

      <p class="lab-result-heading">
        ${currentLang==="fa"
          ?bilingualHeadingHTML(t.labReflection)
          :escapeHTML(t.labReflection)}
      </p>
      <p class="lab-reflection">${escapeHTML(item.reflection)}</p>

      <p class="lab-result-heading">
        ${currentLang==="fa"
          ?bilingualHeadingHTML(t.labContext)
          :escapeHTML(t.labContext)}
      </p>
      <p>${escapeHTML(item.context)}</p>

      <div class="lab-actions">
        <button type="button" class="lab-action" id="labReset">
          ${escapeHTML(t.labReset)}
        </button>
        <button type="button" class="lab-action" id="labNext">
          ${escapeHTML(t.labNext)}
        </button>
      </div>
    </div>
  `;

  panel.innerHTML=`
    <div class="lab-case-label">
      ${currentLang==="fa"
        ?bilingualHeadingHTML(t.labCase)
        :escapeHTML(t.labCase)}
      · <span dir="ltr">${activeCase+1} / ${cases.length}</span>
    </div>

    <h3 class="lab-case-title">
      ${currentLang==="fa"
        ?bilingualHeadingHTML(item.title)
        :escapeHTML(item.title)}
    </h3>

    <p class="lab-scenario">${escapeHTML(item.scenario)}</p>
    <p class="lab-question">${escapeHTML(item.question)}</p>

    <div class="lab-choices" role="group"
         aria-label="${escapeHTML(item.question)}">
      ${item.choices.map((choice,index)=>`
        <button type="button"
          class="lab-choice"
          data-choice="${index}"
          aria-pressed="${selected===index}">
          <span class="lab-choice-letter">${["A","B","C"][index]}</span>
          <span>${escapeHTML(choice.label)}</span>
        </button>
      `).join("")}
    </div>

    ${result}
  `;

  panel.querySelectorAll("[data-choice]").forEach(button=>{
    button.addEventListener("click",()=>{
      choices[activeCase]=Number(button.dataset.choice);
      renderLab();
      const resultElement=document.getElementById("labResult");
      if(resultElement){
        resultElement.scrollIntoView({
          behavior:"auto",
          block:"nearest"
        });
      }
    });
  });

  if(selected!==null){
    document.getElementById("labReset")
      .addEventListener("click",()=>{
        choices[activeCase]=null;
        renderLab();
      });

    document.getElementById("labNext")
      .addEventListener("click",()=>{
        activeCase=(activeCase+1)%cases.length;
        renderLab();
        document.getElementById("labTabs")
          .scrollIntoView({behavior:"auto",block:"nearest"});
      });
  }
}

function renderLanguage(lang){
  if(!translations[lang])lang="de";
  currentLang=lang;
  const t=translations[lang];

  document.documentElement.lang=lang==="en"?"en-GB":lang;
  document.documentElement.dir=lang==="fa"?"rtl":"ltr";
  document.title=t.hero.motto+" | Executive Biography";

  document.querySelectorAll("[data-lang]").forEach(button=>{
    const active=button.dataset.lang===lang;
    button.classList.toggle("active",active);
    button.setAttribute("aria-pressed",String(active));
  });

  document.getElementById("navLinks").innerHTML=
    sectionIDs.map((id,i)=>{
      const label=lang==="fa"
        ?bilingualNavHTML(t.labels[i])
        :escapeHTML(t.labels[i]);
      return `<a href="#${id}">${label}</a>`;
    }).join("");

  setText("heroKicker",t.hero.kicker);
  setText("heroTitle",t.hero.title);
  setText("heroIntro",t.hero.intro);
  setText("heroMotto",t.hero.motto);
  setText("heroPhilosophy",t.hero.philosophy);
  setText("heroCTA",t.hero.cta);

  sectionIDs.forEach((id,i)=>{
    setHeading(id+"Heading",t.headings[i],lang);
  });

  document.getElementById("profileText").innerHTML=
    paragraphsHTML(t.profile);

  document.getElementById("educationText").innerHTML=
    paragraphsHTML(t.education);

  document.getElementById("educationTimeline").innerHTML=
    timelineHTML(t.educationTimeline);

  document.getElementById("careerText").innerHTML=
    paragraphsHTML(t.career);

  setHeading("transformationHeading",t.transformationTitle,lang);

  document.getElementById("transformationText").innerHTML=
    paragraphsHTML(t.transformation);

  document.getElementById("careerTimeline").innerHTML=
    timelineHTML(t.careerTimeline);

  document.getElementById("expertiseSkills").innerHTML=
    t.skills.map(skill=>
      `<div class="skill">${escapeHTML(skill)}</div>`
    ).join("");

  setText("publicationsIntro",t.publicationsIntro);

  const search=document.getElementById("pubSearch");
  search.placeholder=t.search;
  search.setAttribute("aria-label",t.search);
  search.value="";

  const filter=document.getElementById("pubFilter");
  const types=["book","article","paper","interview"];

  filter.innerHTML=`
    <option value="all">${escapeHTML(t.all)}</option>
    ${types.map((type,i)=>
      `<option value="${type}">${escapeHTML(t.categories[i])}</option>`
    ).join("")}
  `;

  renderPublications();

  document.getElementById("entrepreneurshipText").innerHTML=
    paragraphsHTML(t.venture);

  setHeading("motivationHeading",t.motivationTitle,lang);

  document.getElementById("motivationText").innerHTML=
    t.motivation.map((paragraph,i)=>{
      if(i===1){
        return `<blockquote class="quote">${escapeHTML(paragraph)}</blockquote>`;
      }
      return `<p>${escapeHTML(paragraph)}</p>`;
    }).join("");

  document.getElementById("labIntro").innerHTML=
    paragraphsHTML(t.labIntro);

  setText("labDisclaimer",t.labDisclaimer);

  choices=[null,null,null,null];
  renderLab();

  setText("contactIntro",t.contactIntro);
  setText("footerCopyright","© 2026 · "+t.footer);

  try{
    localStorage.setItem("cv-language",lang);
  }catch(error){}
}

document.querySelectorAll("[data-lang]").forEach(button=>{
  button.addEventListener("click",()=>{
    renderLanguage(button.dataset.lang);
  });
});

document.getElementById("pubSearch")
  .addEventListener("input",renderPublications);

document.getElementById("pubFilter")
  .addEventListener("change",renderPublications);

document.getElementById("themeToggle")
  .addEventListener("click",()=>{
    const next=document.documentElement.dataset.theme==="light"
      ?"dark":"light";

    document.documentElement.dataset.theme=next;

    try{
      localStorage.setItem("cv-theme",next);
    }catch(error){}
  });

let initialTheme="dark";
let initialLanguage="de";

try{
  initialTheme=localStorage.getItem("cv-theme")||"dark";
  initialLanguage=localStorage.getItem("cv-language")||"de";
}catch(error){}

document.documentElement.dataset.theme=
  initialTheme==="light"?"light":"dark";

renderLanguage(
  translations[initialLanguage]?initialLanguage:"de"
);
</script>
</body>
</html>
