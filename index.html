
<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Khakzad – Finanzwirtschaft, Risikomanagement, internationale Transformation, künstliche Intelligenz und Unternehmertum. Ein persönlicher Einblick in meinen Werdegang.">
<meta name="theme-color" content="#0b1020">
<title>Khakzad | Finanzwirtschaft, Technologie & Transformation</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --alt: #111b2e;
  --surface: #16233b;
  --text: #edf2fa;
  --muted: #adbed4;
  --accent: #91b6ff;
  --line: #2a3a55;
  --header: rgba(11,16,32,.97);
  --shadow: rgba(0,0,0,.25);
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f8fafd;
  --alt: #edf2f8;
  --surface: #e6edf6;
  --text: #17253e;
  --muted: #536782;
  --accent: #285caa;
  --line: #d1dce9;
  --header: rgba(248,250,253,.97);
  --shadow: rgba(23,37,62,.12);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 145px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, Tahoma, sans-serif;
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

html[lang="fa"] body {
  font-family: Tahoma, "Geeza Pro", Arial, sans-serif;
  line-height: 2;
}

a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
button, input, select { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.container {
  width: min(1140px, calc(100% - 44px));
  margin-inline: auto;
}

.skip {
  position: fixed;
  top: -100px;
  left: 12px;
  z-index: 100;
  padding: 10px 15px;
  background: var(--accent);
  color: var(--bg);
}
.skip:focus { top: 10px; }

/* HEADER */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  width: min(1360px, calc(100% - 36px));
  margin: auto;
  min-height: 86px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px 24px;
  padding-block: 12px;
}

.brand {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  gap: 9px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: .09em;
}

.brand-symbol {
  color: var(--accent);
  font-size: 24px;
}

.nav-links {
  order: 3;
  flex: 0 0 100%;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px 24px;
  min-width: 0;
  padding: 7px 0 2px;
}

.nav-links a {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.nav-links a:hover,
.nav-links a:focus-visible {
  color: var(--accent);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-inline-start: auto;
}

.lang-switch {
  display: flex;
  gap: 3px;
  align-items: center;
}

.lang-switch button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 8px;
  min-height: 40px;
  font-size: 12px;
}

.lang-switch button.active {
  color: var(--accent);
  font-weight: 800;
}

.theme-toggle,
.menu-toggle {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  width: 42px;
  height: 42px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 21px;
}

.menu-toggle { display: none; }

/* HERO */

.hero {
  min-height: 78svh;
  display: flex;
  align-items: center;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(
      ellipse at 80% 25%,
      rgba(76,117,193,.18),
      transparent 47%
    ), var(--bg);
}

.hero::before,
.hero::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(145,182,255,.10);
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
}

.hero::before {
  width: 680px;
  height: 680px;
  inset-inline-end: -250px;
  top: -115px;
}

.hero::after {
  width: 450px;
  height: 450px;
  inset-inline-end: -130px;
  top: 20px;
}

.hero-content {
  min-width: 0;
  padding-block: 100px 110px;
}

.eyebrow,
.section-number,
.small-label {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .09em;
}

.hero h1 {
  max-width: 950px;
  font-size: clamp(40px, 6.4vw, 82px);
  line-height: 1.17;
  font-weight: 500;
  letter-spacing: -.045em;
  margin: 25px 0 30px;
}

.hero-intro {
  max-width: 710px;
  color: var(--muted);
  font-size: clamp(17px, 2vw, 20px);
  line-height: 1.8;
}

.hero-line {
  width: 82px;
  height: 1px;
  background: var(--accent);
  margin: 41px 0 29px;
}

.hero-motto {
  font-size: clamp(24px, 3vw, 35px);
  font-weight: 450;
  line-height: 1.4;
  margin: 0;
}

.hero-philosophy {
  max-width: 760px;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.8;
  margin-top: 22px;
}

.hero-cta {
  display: inline-flex;
  margin-top: 36px;
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
}

/* SECTIONS */

.section {
  padding-block: clamp(72px, 8vw, 108px);
  border-bottom: 1px solid var(--line);
}

.section.alt { background: var(--alt); }

.section-layout {
  display: grid;
  grid-template-columns: 185px minmax(0, 1fr);
  gap: clamp(30px, 5vw, 65px);
}

.section-number { padding-top: 13px; }

.section-content {
  max-width: 820px;
  min-width: 0;
}

.section-content h2 {
  font-size: clamp(30px, 4vw, 50px);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -.032em;
  margin: 0 0 34px;
}

.section-content h3 {
  font-size: clamp(23px, 2.7vw, 30px);
  font-weight: 500;
  line-height: 1.4;
  margin: 52px 0 23px;
}

.hero h1,
.hero-motto,
.section-content h2,
.section-content h3,
.timeline-item h4,
.pub-item h4,
.lab-case-title,
.lab-result-heading {
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  max-width: 100%;
}

.heading-primary { display: block; }

.heading-english {
  display: block;
  direction: ltr;
  text-align: end;
  color: var(--accent);
  font-size: .52em;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: 0;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.paragraphs { max-width: 72ch; }

.paragraphs p,
.section-content > p {
  font-size: 17px;
  color: var(--muted);
  line-height: 1.88;
  margin: 0 0 23px;
  overflow-wrap: break-word;
}

.paragraphs p:first-child { color: var(--text); }

html[dir="rtl"] .section-content h2,
html[dir="rtl"] .section-content h3,
html[dir="rtl"] .hero h1 {
  letter-spacing: 0;
  line-height: 1.55;
}

html[dir="rtl"] .paragraphs p { line-height: 2.15; }

/* TIMELINE */

.timeline {
  margin-top: 40px;
  border-top: 1px solid var(--line);
}

.timeline-item {
  display: grid;
  grid-template-columns: 135px minmax(0, 1fr);
  gap: 25px;
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.timeline-year {
  color: var(--accent);
  font-size: 14px;
  font-weight: 700;
}

.timeline-item h4 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  margin: 0 0 6px;
}

.timeline-item p {
  color: var(--muted);
  font-size: 14px;
  margin: 0;
  line-height: 1.7;
}

/* EXPERTISE */

.skills {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.skill {
  padding: 26px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  min-width: 0;
}

.skill-symbol {
  display: block;
  color: var(--accent);
  font-size: 12px;
  margin-bottom: 15px;
}

.skill h3 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  margin: 0 0 10px;
}

.skill p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.75;
  margin: 0;
}

/* PUBLICATIONS */

.pub-toolbar {
  display: flex;
  gap: 12px;
  margin: 28px 0 18px;
}

.pub-toolbar input,
.pub-toolbar select {
  min-height: 48px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 10px 14px;
}

.pub-toolbar input {
  flex: 1;
  min-width: 0;
}

.pub-toolbar select { max-width: 100%; }

.pub-count {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 24px;
}

.pub-item {
  display: grid;
  grid-template-columns: 85px minmax(0, 1fr);
  gap: 20px;
  padding: 25px 0;
  border-top: 1px solid var(--line);
}

.pub-year {
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
}

.pub-item h4 {
  font-size: 17px;
  font-weight: 550;
  line-height: 1.55;
  margin: 5px 0 10px;
}

.pub-item p {
  color: var(--muted);
  font-size: 13px;
  margin: 3px 0;
}

.empty {
  color: var(--muted);
  padding: 22px 0;
}

.link-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 19px;
  margin-top: 21px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.5;
  text-align: center;
}

.link-button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.project-name {
  font-size: 27px !important;
  font-weight: 600;
  color: var(--accent) !important;
}

.quote {
  border-inline-start: 2px solid var(--accent);
  padding-inline-start: 24px;
  font-size: clamp(20px, 2.4vw, 27px);
  font-weight: 450;
  line-height: 1.7;
  margin: 32px 0;
}

/* THINKING LAB */

.lab-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 34px 0 22px;
}

.lab-tab {
  background: transparent;
  color: var(--muted);
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 13px;
  text-align: start;
  overflow-wrap: anywhere;
}

.lab-tab:hover,
.lab-tab.active {
  color: var(--accent);
  background: var(--surface);
  border-color: var(--accent);
}

.lab-panel {
  padding: clamp(23px, 4vw, 40px);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 5px;
}

.lab-case-label {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
}

.lab-case-title {
  font-size: clamp(23px, 3vw, 32px);
  font-weight: 500;
  line-height: 1.4;
  margin: 13px 0 20px;
}

.lab-scenario {
  font-size: 17px;
  line-height: 1.9;
  margin: 0 0 26px;
}

.lab-question {
  color: var(--accent);
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 16px;
}

.lab-choices {
  display: grid;
  gap: 10px;
}

.lab-choice {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 17px 19px;
  line-height: 1.65;
  text-align: start;
  overflow-wrap: anywhere;
}

.lab-choice:hover,
.lab-choice[aria-pressed="true"] {
  border-color: var(--accent);
}

.lab-choice[aria-pressed="true"] {
  background: var(--alt);
}

.lab-choice-letter {
  color: var(--accent);
  font-size: 13px;
  font-weight: 750;
  min-width: 23px;
  direction: ltr;
}

.lab-result {
  border-top: 1px solid var(--line);
  margin-top: 25px;
  padding-top: 25px;
}

.lab-result p {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.85;
}

.lab-result-heading {
  color: var(--accent) !important;
  font-size: 12px !important;
  font-weight: 700;
  margin: 22px 0 10px;
}

.lab-reflection {
  color: var(--text) !important;
  border-inline-start: 2px solid var(--accent);
  padding-inline-start: 18px;
}

.lab-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 24px;
}

.lab-action {
  border: 1px solid var(--line);
  color: var(--accent);
  background: transparent;
  border-radius: 4px;
  padding: 11px 16px;
  font-size: 13px;
}

.lab-action:hover { border-color: var(--accent); }

.lab-disclaimer {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
  margin-top: 20px;
}

/* FOOTER */

footer {
  background: var(--alt);
  color: var(--muted);
  padding: 30px 0;
  font-size: 12px;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

/* RESPONSIVE */

@media (max-width: 980px) {
  .header-inner {
    position: relative;
    flex-wrap: nowrap;
    min-height: 70px;
    gap: 8px;
  }

  .brand-label { display: none; }

  .menu-toggle { display: inline-flex; }

  .nav-links {
    position: absolute;
    top: calc(100% + 7px);
    inset-inline: 0;
    order: unset;
    flex: none;
    width: 100%;
    max-height: 72svh;
    overflow-x: hidden;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 10px;
    background: var(--alt);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 18px 38px var(--shadow);
  }

  .nav-links.is-open { display: flex; }

  .nav-links a {
    display: block;
    padding: 12px;
    font-size: 15px;
    width: 100%;
  }

  .section-layout {
    grid-template-columns: 150px minmax(0, 1fr);
    gap: 32px;
  }
}

@media (max-width: 680px) {
  .container,
  .header-inner {
    width: calc(100% - 36px);
  }

  .header-controls { gap: 5px; }
  .lang-switch { gap: 0; }
  .lang-switch button { padding: 5px; }

  .hero { min-height: auto; }

  .hero-content { padding-block: 75px 85px; }

  .hero h1 {
    font-size: clamp(35px, 9vw, 54px);
  }

  .hero-philosophy { font-size: 16px; }
  .section-layout { display: block; }

  .section-number {
    display: block;
    margin-bottom: 22px;
    padding-top: 0;
  }

  .section-content h2 { margin-bottom: 28px; }
  .paragraphs p { font-size: 16px; }

  .timeline-item {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .skills { grid-template-columns: 1fr; }
  .pub-toolbar { flex-direction: column; }

  .pub-item {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .lab-tabs { flex-direction: column; }
  .lab-tab { width: 100%; }
  .lab-choice { padding: 15px; }

  html[dir="rtl"] .section-content h2 { font-size: 30px; }
  html[dir="rtl"] .section-content h3 { font-size: 24px; }
}

@media (max-width: 350px) {
  .header-inner { gap: 4px; }
  .lang-switch button { min-width: 27px; padding: 3px; }
  .menu-toggle, .theme-toggle { width: 39px; height: 39px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>

<body>

<a href="#main" class="skip" id="skipLink">Zum Inhalt springen</a>

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand" aria-label="Zur Startseite">
      <span class="brand-symbol" aria-hidden="true">◈</span>
      <span class="brand-label">EXECUTIVE BIOGRAPHY</span>
    </a>

    <nav id="navLinks" class="nav-links" aria-label="Hauptnavigation"></nav>

    <div class="header-controls">
      <div class="lang-switch" role="group" aria-label="Sprache">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fa" lang="fa">فارسی</button>
      </div>

      <button type="button" id="themeToggle" class="theme-toggle"
              aria-label="Farbschema ändern">◐</button>

      <button type="button" id="menuToggle" class="menu-toggle"
              aria-controls="navLinks"
              aria-expanded="false"
              aria-label="Menü öffnen">☰</button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero" id="top">
    <div class="container hero-content">
      <p class="eyebrow" id="heroKicker"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-intro" id="heroIntro"></p>
      <div class="hero-line"></div>
      <p class="hero-motto" id="heroMotto"></p>
      <p class="hero-philosophy" id="heroPhilosophy"></p>
      <a class="hero-cta" href="#profile" id="heroCTA"></a>
    </div>
  </section>

  <section class="section" id="profile">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="profileHeading"></h2>
        <div id="profileText" class="paragraphs"></div>
      </div>
    </div>
  </section>

  <section class="section alt" id="education">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="educationHeading"></h2>
        <div id="educationText" class="paragraphs"></div>
        <div id="educationTimeline" class="timeline"></div>
      </div>
    </div>
  </section>

  <section class="section" id="career">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="careerHeading"></h2>
        <div id="careerText" class="paragraphs"></div>
        <h3 id="transformationHeading"></h3>
        <div id="transformationText" class="paragraphs"></div>
        <div id="careerTimeline" class="timeline"></div>
      </div>
    </div>
  </section>

  <section class="section alt" id="expertise">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="expertiseHeading"></h2>
        <div id="expertiseSkills" class="skills"></div>
      </div>
    </div>
  </section>

  <section class="section" id="publications">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="publicationsHeading"></h2>
        <p id="publicationsIntro"></p>
        <div class="pub-toolbar">
          <input type="search" id="pubSearch">
          <select id="pubFilter"></select>
        </div>
        <p id="pubCount" class="pub-count" role="status"></p>
        <div id="pubList"></div>
        <button type="button" id="pubMore" class="link-button" hidden></button>
      </div>
    </div>
  </section>

  <section class="section alt" id="entrepreneurship">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="entrepreneurshipHeading"></h2>
        <p class="project-name">Ready Labs</p>
        <div id="entrepreneurshipText" class="paragraphs"></div>

        <a id="readyTenderLink" class="link-button"
           href="https://www.ready-tender.de/"
           target="_blank" rel="noopener noreferrer">
          Ready Tender ↗
        </a>

        <h3 id="motivationHeading"></h3>
        <div id="motivationText" class="paragraphs"></div>
      </div>
    </div>
  </section>

  <section class="section" id="lab">
    <div class="container section-layout">
      <aside class="section-number"></aside>
      <div class="section-content">
        <h2 id="labHeading"></h2>
        <div id="labIntro" class="paragraphs"></div>
        <div id="labTabs" class="lab-tabs" role="group"></div>
        <div id="labPanel" class="lab-panel"></div>
        <p id="labDisclaimer" class="lab-disclaimer"></p>
      </div>
    </div>
  </section>

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[character]);
}

function setText(id, value) {
  $(id).textContent = value;
}

function paragraphsHTML(lines) {
  return lines.map(line => `<p>${escapeHTML(line)}</p>`).join("");
}

function timelineHTML(items) {
  return items.map(([year, heading, detail]) => `
    <article class="timeline-item">
      <div class="timeline-year" dir="ltr">${escapeHTML(year)}</div>
      <div>
        <h4>${escapeHTML(heading)}</h4>
        <p>${escapeHTML(detail)}</p>
      </div>
    </article>
  `).join("");
}

function headingHTML(value, lang) {
  if (lang !== "fa") return escapeHTML(value);

  const match = value.match(/^(.*?)\s+\(([^()]*)\)$/);

  if (!match) return escapeHTML(value);

  return `
    <span class="heading-primary" lang="fa">${escapeHTML(match[1])}</span>
    <span class="heading-english" lang="en" dir="ltr">${escapeHTML(match[2])}</span>
  `;
}

function setHeading(id, value, lang) {
  $(id).innerHTML = headingHTML(value, lang);
}

        (category === "all" || pub[5] === category);
    })
    .sort((a,b) =>
      b.pub[0] - a.pub[0] || b.index - a.index
    );

  setText("pubCount", results.length + " " + t.count);

  const filtering = query.length > 0 || category !== "all";
  const visible = filtering
    ? results
    : results.slice(0,publicationLimit);

  if (!visible.length) {
    $("pubList").innerHTML =
      `<p class="empty">${escapeHTML(t.noResults)}</p>`;
  } else {
    $("pubList").innerHTML = visible.map(({pub}) => `
      <article class="pub-item">
        <div class="pub-year" dir="ltr">${escapeHTML(pub[0])}</div>
        <div>
          <p>${escapeHTML(pub[3])}</p>
          <h4>${escapeHTML(pub[2])}</h4>
          <p>${escapeHTML(pub[1])}</p>
          <p>${escapeHTML(pub[4])}</p>
        </div>
      </article>
    `).join("");
  }

  $("pubMore").hidden = filtering || results.length <= publicationLimit;
  $("pubMore").textContent = t.more;
}

/* =====================================================
   THINKING LAB
   ===================================================== */

function renderLab(options = {}) {
  const t = translations[currentLang];
  const cases = labCases[currentLang];
  const item = cases[activeCase];
  const selected = choices[activeCase];

  $("labTabs").innerHTML = cases.map((entry,index) => `
    <button type="button"
      class="lab-tab ${index === activeCase ? "active" : ""}"
      data-case="${index}"
      aria-pressed="${index === activeCase}">
      ${escapeHTML(entry.tab)}
    </button>
  `).join("");

  const resultHTML = selected === null ? "" : `
    <div class="lab-result" id="labResult" aria-live="polite">
      <p class="lab-result-heading">${escapeHTML(t.labConsequence)}</p>
      <p>${escapeHTML(item.choices[selected].consequence)}</p>

      <p class="lab-result-heading">${escapeHTML(t.labReflection)}</p>
      <p class="lab-reflection">${escapeHTML(item.reflection)}</p>

      <p class="lab-result-heading">${escapeHTML(t.labContext)}</p>
      <p>${escapeHTML(item.context)}</p>

      <div class="lab-actions">
        <button type="button" class="lab-action" id="labReset">
          ${escapeHTML(t.labReset)}
        </button>
        <button type="button" class="lab-action" id="labNext">
          ${escapeHTML(t.labNext)}
        </button>
      </div>
    </div>
  `;

  $("labPanel").innerHTML = `
    <div class="lab-case-label">
      ${escapeHTML(t.labCase)}
      · <span dir="ltr">${activeCase + 1} / ${cases.length}</span>
    </div>

    <h3 class="lab-case-title">${escapeHTML(item.title)}</h3>
    <p class="lab-scenario">${escapeHTML(item.scenario)}</p>
    <p class="lab-question">${escapeHTML(item.question)}</p>

    <div class="lab-choices" role="group"
         aria-label="${escapeHTML(item.question)}">
      ${item.choices.map((choice,index) => `
        <button type="button"
          class="lab-choice"
          data-choice="${index}"
          aria-pressed="${selected === index}">
          <span class="lab-choice-letter">${["A","B","C"][index]}</span>
          <span>${escapeHTML(choice.label)}</span>
        </button>
      `).join("")}
    </div>

    ${resultHTML}
  `;

  if (options.focusChoice !== undefined) {
    $("labPanel")
      .querySelector(`[data-choice="${options.focusChoice}"]`)
      ?.focus({preventScroll:true});
  } else if (options.focusTab) {
    $("labTabs")
      .querySelector(`[data-case="${activeCase}"]`)
      ?.focus({preventScroll:true});
  }
}

/* =====================================================
   NAVIGATION
   ===================================================== */

function setMenuOpen(open) {
  $("navLinks").classList.toggle("is-open",open);
  $("menuToggle").setAttribute("aria-expanded",String(open));
  $("menuToggle").textContent = open ? "✕" : "☰";

  const t = translations[currentLang];
  $("menuToggle").setAttribute(
    "aria-label", open ? t.menuClose : t.menuOpen
  );
}

/* =====================================================
   LANGUAGE RENDERING
   ===================================================== */

function renderLanguage(lang) {
  if (!translations[lang]) lang = "de";

  currentLang = lang;
  const t = translations[lang];

  document.documentElement.lang = lang === "en" ? "en-GB" : lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

  document.title =
    lang === "de"
      ? "Khakzad | Finanzwirtschaft, Technologie & Transformation"
      : lang === "en"
        ? "Khakzad | Financial Services, Technology & Transformation"
        : "Khakzad | امور مالی، فناوری و تحول";

  document.querySelector('meta[name="description"]')
    .setAttribute("content",t.meta);

  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active",active);
    button.setAttribute("aria-pressed",String(active));
  });

  $("navLinks").innerHTML = navIDs.map((id,index) => `
    <a href="#${id}">${escapeHTML(t.nav[index])}</a>
  `).join("");

  $("navLinks").setAttribute("aria-label",t.navigation);
  $("menuToggle").setAttribute("aria-label",t.menuOpen);
  $("themeToggle").setAttribute("aria-label",t.theme);
  $("skipLink").textContent = t.skip;

  document.querySelectorAll(".section-number")
    .forEach((element,index) => {
      element.textContent =
        String(index + 1).padStart(2,"0") + " / " + t.side[index];
    });

  setText("heroKicker",t.hero.kicker);
  setText("heroTitle",t.hero.title);
  setText("heroIntro",t.hero.intro);
  setText("heroMotto",t.hero.motto);
  setText("heroPhilosophy",t.hero.philosophy);
  setText("heroCTA",t.hero.cta);

  sectionIDs.forEach((id,index) => {
    setHeading(id + "Heading",t.headings[index],lang);
  });

  $("profileText").innerHTML = paragraphsHTML(t.profile);
  $("educationText").innerHTML = paragraphsHTML(t.education);
  $("educationTimeline").innerHTML = timelineHTML(t.educationTimeline);

  $("careerText").innerHTML = paragraphsHTML(t.career);
  setHeading("transformationHeading",t.transformationTitle,lang);
  $("transformationText").innerHTML = paragraphsHTML(t.transformation);
  $("careerTimeline").innerHTML = timelineHTML(t.careerTimeline);

  $("expertiseSkills").innerHTML = t.skills.map(([title,description]) => `
    <article class="skill">
      <span class="skill-symbol" aria-hidden="true">◆</span>
      <h3>${escapeHTML(title)}</h3>
      <p>${escapeHTML(description)}</p>
    </article>
  `).join("");

  setText("publicationsIntro",t.publicationsIntro);

  const search = $("pubSearch");
  search.placeholder = t.search;
  search.setAttribute("aria-label",t.search);

  const filter = $("pubFilter");
  const savedCategory = filter.value || "all";

  filter.innerHTML = `
    <option value="all">${escapeHTML(t.all)}</option>
    ${categories.map((category,index) => `
      <option value="${category}">${escapeHTML(t.categories[index])}</option>
    `).join("")}
  `;

  filter.value = categories.includes(savedCategory) ? savedCategory : "all";
  filter.setAttribute("aria-label",t.all);

  renderPublications();

  $("entrepreneurshipText").innerHTML = paragraphsHTML(t.venture);
  setHeading("motivationHeading",t.motivationTitle,lang);

  $("motivationText").innerHTML = t.motivation.map((text,index) =>
    index === 1
      ? `<blockquote class="quote">${escapeHTML(text)}</blockquote>`
      : `<p>${escapeHTML(text)}</p>`
  ).join("");

  $("labIntro").innerHTML = paragraphsHTML(t.labIntro);
  $("labDisclaimer").textContent = t.labDisclaimer;
  $("labTabs").setAttribute("aria-label",t.headings[6]);
  renderLab();

  setText("contactIntro",t.contactIntro);
  setText("readyTenderLink",t.readyTender);
  setText("readyLabsLink",t.readyLabs);
  setText("footerTop",t.backTop);
  setText("footerCopyright","© 2026 · " + t.footer);

  setMenuOpen(false);

  try {
    localStorage.setItem("cv-language",lang);
  } catch (error) {}
}

/* =====================================================
   EVENT LISTENERS
   ===================================================== */

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click",() => {
    renderLanguage(button.dataset.lang);
  });
});

$("menuToggle").addEventListener("click",() => {
  const open = $("menuToggle").getAttribute("aria-expanded") !== "true";
  setMenuOpen(open);
});

$("navLinks").addEventListener("click",event => {
  if (event.target.closest("a")) {
    setMenuOpen(false);
  }
});

document.addEventListener("keydown",event => {
  if (
    event.key === "Escape" &&
    $("menuToggle").getAttribute("aria-expanded") === "true"
  ) {
    setMenuOpen(false);
    $("menuToggle").focus();
  }
});

document.addEventListener("click",event => {
  if (!event.target.closest(".site-header")) {
    setMenuOpen(false);
  }
});

window.addEventListener("resize",() => {
  if (window.innerWidth > 980) setMenuOpen(false);
});

$("pubSearch").addEventListener("input",renderPublications);
$("pubFilter").addEventListener("change",renderPublications);

$("pubMore").addEventListener("click",() => {
  publicationLimit += 8;
  renderPublications();
});

$("labTabs").addEventListener("click",event => {
  const button = event.target.closest("[data-case]");
  if (!button) return;

  activeCase = Number(button.dataset.case);
  renderLab({focusTab:true});
});

$("labPanel").addEventListener("click",event => {
  const choiceButton = event.target.closest("[data-choice]");

  if (choiceButton) {
    const selected = Number(choiceButton.dataset.choice);
    choices[activeCase] = selected;
    renderLab({focusChoice:selected});
    return;
  }

  if (event.target.closest("#labReset")) {
    choices[activeCase] = null;
    renderLab({focusChoice:0});
    return;
  }

  if (event.target.closest("#labNext")) {
    activeCase = (activeCase + 1) % labCases[currentLang].length;
    renderLab({focusTab:true});
  }
});

$("themeToggle").addEventListener("click",() => {
  const next =
    document.documentElement.dataset.theme === "light"
      ? "dark" : "light";

  document.documentElement.dataset.theme = next;

  try {
    localStorage.setItem("cv-theme",next);
  } catch (error) {}
});

/* =====================================================
   INITIALIZATION
   ===================================================== */

let initialTheme = "dark";
let initialLanguage = "de";

try {
  initialTheme = localStorage.getItem("cv-theme") || "dark";
  initialLanguage = localStorage.getItem("cv-language") || "de";
} catch (error) {}

document.documentElement.dataset.theme =
  initialTheme === "light" ? "light" : "dark";

renderLanguage(
  translations[initialLanguage] ? initialLanguage : "de"
);

</script>
</body>
</html>
